    <!-- MathJax 4 Configuration -->
    <script>
      window.MathJax = {
        loader: { load: ['input/tex', 'output/chtml', 'ui/menu'] },

          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true

        chtml: {
          matchFontHeight: false,
          linebreaks: { automatic: false }
        },
        startup: {
          typeset: false
        }
      };
    </script>

    <link rel="stylesheet" href="style.css">
